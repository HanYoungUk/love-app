<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="영욱 ❤️ 소영">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Love App">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Love App</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #FFFFFF; }
    /* 로딩 중에는 아무것도 없는 흰 화면만 보여준다 */
    #loading {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      z-index: 999;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>
  <div id="loading"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.style.opacity = '0';
      setTimeout(function () { el.style.display = 'none'; }, 400);
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js');
    }
  </script>
  <!-- 캡쳐 인식용 OCR 글루 (tesseract 본체는 처음 쓸 때만 내려받음) -->
  <script src="ocr/ocr.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
